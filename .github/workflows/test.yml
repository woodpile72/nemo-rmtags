name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-mutagen ffmpeg
      - name: Run tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
